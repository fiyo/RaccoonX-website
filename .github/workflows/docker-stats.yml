name: Docker Stats Sync

on:
  schedule:
    # 每 30 分钟执行一次
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # 手动触发

# 用 GITHUB_TOKEN 推回本仓库需要写权限
permissions:
  contents: write

# 避免并发运行互相干扰
concurrency:
  group: docker-stats-sync
  cancel-in-progress: false

jobs:
  sync-docker-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 官网仓库默认分支为 website
          ref: website
          # 关闭持久凭证，下面用 token 显式注入 push URL，保证鉴权稳定
          persist-credentials: false

      - name: Fetch Docker Hub pull count
        id: docker-hub
        run: |
          set -uo pipefail
          REPO="jackge12345/dbcheck"
          # -f 失败即退出；-sS 静默；网络抖动时优雅跳过而非报错中断
          RESPONSE=$(curl -fsS "https://hub.docker.com/v2/repositories/${REPO}/" || true)
          if [ -z "$RESPONSE" ]; then
            echo "Docker Hub API 不可达，保留上次有效值，本次跳过"
            exit 0
          fi
          PULL_COUNT=$(echo "$RESPONSE" | python3 -c "import sys, json; d=json.load(sys.stdin); print(int(d.get('pull_count', 0)))" || true)
          echo "Docker Pulls: $PULL_COUNT"
          # 仅当拿到正整数时才输出，供后续步骤使用；否则保持静默跳过
          if [ -n "$PULL_COUNT" ] && [ "$PULL_COUNT" -gt 0 ]; then
            echo "pull_count=$PULL_COUNT" >> "$GITHUB_OUTPUT"
          else
            echo "无效拉取数 ($PULL_COUNT)，保留上次有效值，本次跳过"
          fi

      - name: Update docker-stats.json
        if: ${{ steps.docker-hub.outputs.pull_count != '' }}
        run: |
          # 写入本仓库（DBCheck-website）根目录的 JSON 文件
          cat > docker-stats.json << EOF
          {
            "pull_count": ${{ steps.docker-hub.outputs.pull_count }},
            "updated_at": "$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          }
          EOF
          cat docker-stats.json

      - name: Commit and push
        if: ${{ steps.docker-hub.outputs.pull_count != '' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # 显式用 GITHUB_TOKEN 注入 push URL，确保推送鉴权（避免默认 remote 无凭证被拒）
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/fiyo/DBCheck-website.git"
          git add docker-stats.json
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "docs: sync Docker Hub pull count"
          git push
